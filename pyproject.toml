[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lurewall"
version = "0.0.1.dev0"
description = "Defensive, lab-only AI-agent canaries and detector with a signed event log. In development, not ready for use."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Paul Charydczak" }]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff==0.17.5",
]

[project.urls]
Repository = "https://github.com/python1/lurewall"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
xfail_strict = true
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["third_party"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# assert is how pytest tests are written.
"tests/**" = ["S101"]
