[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lurewall"
version = "0.4.0"
description = "Defensive nginx canaries and detector with a signed event log."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Paul Charydczak" }]
dependencies = [
    # The floor eureka_protocol states for its signing code.
    "cryptography>=50.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "h2>=4,<5", # HTTP/2 integration client (tests only)
    "ruff==0.17.5",
]

[project.scripts]
lurewall = "lurewall.cli:main"

[project.urls]
Repository = "https://github.com/python1/lurewall"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
xfail_strict = true
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["third_party"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# assert is how pytest tests are written.
# Hostile-string fixtures hold confusable characters on purpose.
# Seeded random.Random makes generator tests repeatable; it guards nothing.
"tests/**" = ["S101", "RUF001", "S311"]
