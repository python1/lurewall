name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: CI never writes to the repo, never releases, never deploys.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python -m pip install "ruff==0.17.5"
      - run: ruff check . deploy/manage deploy/debian/build deploy/debian/lifecycle
      - run: ruff format --check . deploy/manage deploy/debian/build deploy/debian/lifecycle

  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is what Debian 12 (the lab container) ships.
        python-version: ["3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # exercise the released v0.3 reader in the rollback test
          submodules: true # eureka's signing code, pinned by commit
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest

  nginx-integration:
    # The built lab site behind a real nginx on the runner's loopback address.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install nginx and its JavaScript module
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nginx libnginx-mod-http-js
          PATH="$PATH:/usr/sbin" nginx -V
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest tests/test_nginx_integration.py tests/test_lab_e2e.py tests/test_natural_nginx.py -v
        env:
          LUREWALL_REQUIRE_NGINX: "1"

  nft-integration:
    # The nftables adapter against a real nft, as root inside a private network
    # namespace (unshare --net), so the runner's own firewall is never touched.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install nftables if the runner has none
        run: |
          set -euo pipefail
          if ! command -v nft >/dev/null && [ ! -x /usr/sbin/nft ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends nftables
          fi
          PATH="$PATH:/usr/sbin" nft --version
      - run: python -m pip install -e ".[dev]"
      - name: Run the adapter tests against real nftables
        run: |
          set -euo pipefail
          sudo unshare --net env LUREWALL_REQUIRE_NFT=1 PATH="$PATH:/usr/sbin" \
            "$(command -v python)" -m pytest tests/test_nft.py -v -p no:cacheprovider

  debian13:
    # The lab container runs Debian 13 (trixie): nftables 1.1.3, nginx 1.26, Python 3.13.
    # The real-nft, real-nginx and lab end-to-end tests again, on those exact
    # packages, inside a trixie container. The container has its own network
    # namespace; NET_ADMIN applies to that namespace only, never the runner's.
    runs-on: ubuntu-24.04
    container:
      # debian:trixie, pinned by digest (multi-arch index)
      image: debian@sha256:9c6e381421d0f48d1b8133e573f33c185ee16cbf505eda9c4a8a4791b25ea8a6
      options: --cap-add=NET_ADMIN
    steps:
      - name: Install Debian's packages
        run: |
          set -eu
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git nginx libnginx-mod-http-js nftables python3 python3-venv
          . /etc/os-release && echo "$PRETTY_NAME"
          nft --version
          nginx -v
          python3 --version
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - name: Install Lurewall in a venv
        run: |
          python3 -m venv /opt/venv
          /opt/venv/bin/pip install -e ".[dev]"
      - name: Real nftables, real nginx and the lab end to end
        env:
          LUREWALL_REQUIRE_NFT: "1"
          LUREWALL_REQUIRE_NGINX: "1"
        run: |
          /opt/venv/bin/python -m pytest -v -p no:cacheprovider \
            tests/test_nft.py tests/test_nginx_integration.py tests/test_lab_e2e.py tests/test_natural_nginx.py

  operator-install:
    # A disposable runner. nginx serves only a loopback test vhost and
    # Lurewall stays in observation mode throughout.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - name: Install operator prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nginx libnginx-mod-http-js nftables logrotate python3-venv
      - name: Install, observe, upgrade, and uninstall
        run: |
          set -euo pipefail
          sudo ./deploy/manage install
          sudo systemctl is-active --quiet lurewall.service
          sudo systemctl start lurewall-sweeper.service
          sudo systemctl start lurewall-notify.service lurewall-notify-failure.service
          sudo /usr/local/sbin/lurewall allowlist add 192.0.2.88/32
          sudo /usr/local/sbin/lurewall allowlist remove 192.0.2.88/32
          sudo install -d -m 0755 -o lurewall -g lurewall /srv/lurewall/site
          sudo -u lurewall /usr/local/sbin/lurewall lab-site build \
            --state /var/lib/lurewall/canaries.json --out /srv/lurewall/site \
            --server-name lurewall.example --listen 127.0.0.1:18119
          sudo ln -s /etc/lurewall/nginx/operator-format.conf /etc/nginx/conf.d/lurewall-ci.conf
          sudo install -m 0600 /srv/lurewall/site/nginx/lurewall-site.conf \
            /etc/nginx/sites-enabled/lurewall-ci
          sudo nginx -t
          sudo systemctl start nginx
          sudo systemctl reload nginx

          visit_site() {
            curl --fail --silent --show-error --noproxy '*' --retry 5 --retry-connrefused \
              --resolve lurewall.example:18119:127.0.0.1 http://lurewall.example:18119/ >/dev/null
          }
          visit_site
          for attempt in {1..25}; do
            if sudo grep -Eq '^lurewall_records_processed_total [1-9][0-9]*$' \
              /var/lib/lurewall/telemetry/lurewall.prom; then
              break
            fi
            sleep 1
          done
          sudo grep -Eq '^lurewall_records_processed_total [1-9][0-9]*$' \
            /var/lib/lurewall/telemetry/lurewall.prom
          sudo /usr/local/sbin/lurewall doctor --json | python3 -c \
            'import json,sys; check=next(x for x in json.load(sys.stdin) if x["name"]=="permissions"); assert check["level"]=="pass",check'
          sudo nft -j list tables | python3 -c \
            'import json,sys; assert all(x.get("table",{}).get("name") != "lurewall" for x in json.load(sys.stdin)["nftables"])'

          sudo logrotate --force --state "$RUNNER_TEMP/lurewall-logrotate.state" /etc/logrotate.d/lurewall
          sudo test -s /var/log/lurewall/access.jsonl.1
          for attempt in {1..15}; do
            visit_site
            if sudo -u lurewall test -s /var/log/lurewall/access.jsonl; then
              break
            fi
            sleep 1
          done
          sudo -u lurewall test -s /var/log/lurewall/access.jsonl
          cursor_followed_rotation() {
            sudo python3 -c '
          import json
          from pathlib import Path
          log = Path("/var/log/lurewall/access.jsonl")
          cursor = json.loads(Path("/var/lib/lurewall/reader.state").read_text())
          assert cursor["inode"] == log.stat().st_ino and cursor["offset"] > 0
          '
          }
          for attempt in {1..15}; do
            if cursor_followed_rotation 2>/dev/null; then break; fi
            sleep 1
          done
          cursor_followed_rotation

          public_key=$(sudo /usr/local/sbin/lurewall pubkey --key /var/lib/lurewall/keys/lurewall.key)
          log_inode=$(sudo stat -c %i /var/lib/lurewall/events.log)
          sudo ./deploy/manage upgrade
          sudo systemctl is-active --quiet lurewall.service
          test "$public_key" = "$(sudo /usr/local/sbin/lurewall pubkey --key /var/lib/lurewall/keys/lurewall.key)"
          test "$log_inode" = "$(sudo stat -c %i /var/lib/lurewall/events.log)"
          sudo /usr/local/sbin/lurewall doctor

          if sudo ./deploy/manage uninstall; then
            echo "Uninstall should refuse an active nginx include" >&2
            exit 1
          fi
          sudo systemctl is-active --quiet lurewall.service
          sudo rm /etc/nginx/sites-enabled/lurewall-ci /etc/nginx/conf.d/lurewall-ci.conf
          sudo nginx -t
          sudo systemctl reload nginx
          sudo ./deploy/manage uninstall
          test ! -e /usr/local/sbin/lurewall
          sudo test -s /var/lib/lurewall/events.log
          sudo test -s /var/lib/lurewall/keys/lurewall.key
      - name: Inspect service diagnostics after a failure
        if: failure()
        run: sudo journalctl -u lurewall.service -n 40 --no-pager

  deb-build:
    runs-on: ubuntu-24.04
    env:
      LUREWALL_PACKAGE_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: packaging
      - name: Check out the exact source revision being packaged
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ env.LUREWALL_PACKAGE_SOURCE }}
          persist-credentials: false
          submodules: true
          path: packaged-source
      - name: Build the canonical Debian package
        run: |
          set -euo pipefail
          python3 packaging/deploy/debian/build \
            --source-dir packaged-source --source-commit "$LUREWALL_PACKAGE_SOURCE" \
            --output-dir "$RUNNER_TEMP/lurewall-deb"
          sha256sum "$RUNNER_TEMP/lurewall-deb/"*.deb
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lurewall-deb
          path: ${{ runner.temp }}/lurewall-deb/*.deb
          if-no-files-found: error

  deb-install-ubuntu:
    needs: deb-build
    runs-on: ubuntu-24.04
    env:
      LUREWALL_PACKAGE_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lurewall-deb
          path: ${{ runner.temp }}/lurewall-deb
      - run: sudo apt-get update
      - name: Test-install and remove the release artifact
        run: |
          sudo bash tests/smoke_deb.sh "$RUNNER_TEMP/lurewall-deb" "$LUREWALL_PACKAGE_SOURCE" systemd
      - name: Inspect service diagnostics after a failure
        if: failure()
        run: sudo journalctl -u lurewall.service -n 40 --no-pager

  deb-upgrade-ubuntu:
    # The released v0.3.0 package, upgraded to this build on a systemd runner:
    # local conffile edits survive, the fetch unit runs in its real sandbox against
    # Google and OpenAI, a broken identity config never stops the detector, and the
    # operator guide's rollback to v0.3.0 keeps the key, chain and cursor.
    needs: deb-build
    runs-on: ubuntu-24.04
    env:
      V030_DEB: lurewall_0.3.0.deb1+g454127f949fa_all.deb
      V030_SHA256: 3fd3958073486c130b67398fd0412d482ae95e24fe136e56adccf0e0a611a801
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lurewall-deb
          path: ${{ runner.temp }}/lurewall-deb
      - name: Fetch the released v0.3.0 package (pinned by checksum)
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/$V030_DEB" \
            "https://github.com/python1/lurewall/releases/download/v0.3.0/$V030_DEB"
          echo "$V030_SHA256  $RUNNER_TEMP/$V030_DEB" | sha256sum --check --strict
      - run: sudo apt-get update
      - name: Upgrade from v0.3.0, enable identity, break it, roll back
        run: sudo bash tests/upgrade_deb.sh "$RUNNER_TEMP/$V030_DEB" "$RUNNER_TEMP/lurewall-deb"

  deb-install-debian:
    needs: deb-build
    runs-on: ubuntu-24.04
    container:
      # Debian 13 (trixie), pinned multi-arch manifest.
      image: debian@sha256:9c6e381421d0f48d1b8133e573f33c185ee16cbf505eda9c4a8a4791b25ea8a6
      options: --cap-add=NET_ADMIN
    env:
      LUREWALL_PACKAGE_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Prepare fresh Debian container
        run: |
          set -eu
          printf '#!/bin/sh\nexit 101\n' > /usr/sbin/policy-rc.d
          chmod 0755 /usr/sbin/policy-rc.d
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lurewall-deb
          path: ${{ runner.temp }}/lurewall-deb
      - name: Test-install and remove the same artifact without a systemd PID 1
        run: |
          bash tests/smoke_deb.sh "$RUNNER_TEMP/lurewall-deb" "$LUREWALL_PACKAGE_SOURCE" container

  secret-scan:
    runs-on: ubuntu-24.04
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan the whole history, not just the tip
          persist-credentials: false
      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
      - name: Scan git history
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner --exit-code 1 .'
      - name: Scan working tree
        run: '"$RUNNER_TEMP/gitleaks" dir --redact --no-banner --exit-code 1 .'
