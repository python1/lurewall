# Install as /etc/systemd/system/logrotate.timer.d/lurewall.conf (runbook,
# Phase 2), then: systemctl daemon-reload && systemctl restart logrotate.timer
#
# Debian runs logrotate once a day. For maxsize to act during a flood it has
# to run more often. The empty OnCalendar= clears Debian's daily schedule.
[Timer]
OnCalendar=
OnCalendar=*:0/15
AccuracySec=1min
