# Install as /etc/systemd/system/logrotate.timer.d/lurewall.conf (runbook,
# Phase 3), then: systemctl daemon-reload && systemctl restart logrotate.timer
#
# Debian runs logrotate once a day, at a random time up to an hour late. For
# maxsize to act during a flood it has to run every 15 minutes, on time. The
# empty OnCalendar= clears Debian's daily schedule; RandomizedDelaySec=0
# clears its one-hour random delay, which this override would otherwise keep.
[Timer]
OnCalendar=
OnCalendar=*:0/15
AccuracySec=1min
RandomizedDelaySec=0
