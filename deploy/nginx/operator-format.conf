# Include once in nginx's http context. This file alone enables no access log.
# realip_remote_addr is the original socket peer even when nginx rewrites
# remote_addr. Lurewall evaluates the forwarded header against its own policy.
log_format lurewall_operator escape=json
  '{"ts":"$msec","ip":"$realip_remote_addr","method":"$request_method",'
  '"request":"$request","uri":"$request_uri","status":"$status",'
  '"ua":"$http_user_agent","lang":"$http_accept_language",'
  '"referer":"$http_referer","sec_fetch_site":"$http_sec_fetch_site",'
  '"request_id":"$request_id","forwarded_for":"$http_x_forwarded_for"}';
