# Lurewall: JSON access log, one object per line.
#
# Reference copy of the log format the reader parses. The reader accepts
# exactly these eleven fields and nothing else, and a test keeps this file and
# the parser in step. Installing it is part of the lab runbook, not of this
# repository's code.
#
# escape=json escapes the double quote, the backslash and characters below 32.
# It does not touch bytes above 126, so invalid UTF-8 from a client reaches the
# log as raw bytes; the reader decodes those with replacement characters.
log_format lurewall_json escape=json
  '{"ts":"$msec","ip":"$remote_addr","method":"$request_method",'
  '"request":"$request","uri":"$request_uri","status":"$status",'
  '"ua":"$http_user_agent","lang":"$http_accept_language",'
  '"referer":"$http_referer","sec_fetch_site":"$http_sec_fetch_site",'
  '"request_id":"$request_id"}';
access_log /var/log/nginx/lurewall.json.log lurewall_json;

# Per-source rate limit: 10 requests/second, bursts of 20, excess gets 429.
# Rejected requests are still logged, so the reader sees them too.
limit_req_zone $binary_remote_addr zone=lurewall:10m rate=10r/s;
limit_req zone=lurewall burst=20 nodelay;
limit_req_status 429;
